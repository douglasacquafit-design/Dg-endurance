[project]
name = "dgendurance"
version = "0.1.0"
description = "Automação de análise, feedback e prescrição semanal para treinadores de triatlo"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "anthropic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dg = "dgendurance.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dgendurance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
