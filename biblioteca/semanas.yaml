# ============================================================
# Modelos de semana por fase: metodologia POLARIZADA (80/20)
# ============================================================
# ~80% do tempo em Z1-Z2 e ~20% em intensidade alta, quase nada de Z3.
# 7 dias com dobras (atletas avançados). Para quem treina menos, use
# "dias_folga" no cadastro: os treinos daquele dia vão para o próximo dia livre.
# Treinos FORTES marcados com # FORTE.
#
# Fase (semanas até a prova alvo):
#   base        : mais de 16 semanas   -> 2 treinos fortes por semana
#   construcao  : 8 a 16 semanas       -> 3 treinos fortes
#   pico        : 3 a 7 semanas        -> 3 treinos fortes, mais específicos (limiar e ritmo de prova)
#   polimento   : 0 a 2 semanas
#   recuperacao : alerta VERMELHO de dor/fadiga, ou semana leve do ciclo do atleta
#                 (ciclo 3:1, 2:1... definido em config.yaml ou por atleta)
#
# No pico, o "ritmo de prova" do 70.3 / Ironman cai na Z3: é esperado e
# o alerta de zona cinzenta não é disparado nas fases de pico e polimento.

# Fator de volume por distância da prova
fator_distancia:
  sprint: 0.6
  olimpico: 0.75
  "70.3": 1.0
  "140.6": 1.3

# Fator de volume por nível
fator_nivel:
  iniciante: 0.75
  intermediario: 1.0
  avancado: 1.15

semanas:
  base:
    seg: [swim_tecnica, forca]
    ter: [run_rodagem, bike_endurance]
    qua: [swim_aerobio, bike_vo2]            # FORTE
    qui: [run_subidas, forca]                # FORTE
    sex: [swim_tecnica, bike_regenerativo]
    sab: [bike_longo, run_transicao_leve]
    dom: [run_longo]

  construcao:
    seg: [swim_tecnica, run_regenerativo]
    ter: [run_tiros_curtos, bike_endurance]  # FORTE
    qua: [swim_velocidade, bike_vo2_longo]   # FORTE
    qui: [run_rodagem, forca]
    sex: [swim_aerobio, bike_regenerativo]
    sab: [bike_longo, run_transicao]         # FORTE (brick)
    dom: [run_longo]

  pico:
    seg: [swim_tecnica, run_regenerativo]
    ter: [run_limiar, bike_endurance]        # FORTE
    qua: [swim_css, bike_limiar]             # FORTE
    qui: [run_rodagem, forca]
    sex: [swim_aerobio, bike_regenerativo]
    sab: [bike_ritmo_prova, run_transicao]   # FORTE (específico de prova)
    dom: [run_longo, swim_longo]

  polimento:
    seg: [swim_tecnica]
    ter: [swim_css, run_ativacao]
    qua: [bike_ativacao]
    qui: [swim_tecnica, run_regenerativo]
    sex: [bike_regenerativo]
    sab: [bike_ativacao, run_ativacao]
    dom: [swim_tecnica]

  recuperacao:
    seg: [swim_tecnica]
    ter: [run_regenerativo]
    qua: [swim_aerobio, bike_regenerativo]
    qui: [run_rodagem]
    sex: [swim_tecnica]
    sab: [bike_endurance]
    dom: [run_rodagem]
