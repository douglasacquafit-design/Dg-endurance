# ============================================================
# Cadastro de atletas
# Copie este arquivo para "config/atletas.yaml" e preencha.
# (atletas.yaml NÃO vai para o GitHub: contém telefones dos atletas)
# ============================================================
#
# intervals_id : ID do atleta no intervals.icu (ex.: i123456). Aparece na URL
#                quando você abre o atleta: intervals.icu/athlete/i123456/...
# whatsapp     : com DDI e DDD, só números (ex.: 5511999998888)
# nivel        : iniciante | intermediario | avancado
# volume       : multiplicador do volume dos modelos de semana (1.0 = padrão)
# prova_alvo   : prova principal (define a fase: base, construção, pico, polimento)
# dias_folga   : dias em que o atleta não treina (seg, ter, qua, qui, sex, sab, dom)
# observacoes  : tudo que a IA deve considerar ao escrever o feedback

atletas:
  - nome: "Ana Souza"
    intervals_id: "i000001"
    whatsapp: "5511999990001"
    nivel: intermediario
    volume: 1.0
    prova_alvo:
      nome: "Ironman 70.3 Florianópolis"
      data: "2027-04-18"
      distancia: "70.3"
    dias_folga: ["seg"]
    observacoes: "Professora, treina cedo. Histórico de canelite em 2025. Gosta de feedback direto."

  - nome: "Bruno Lima"
    intervals_id: "i000002"
    whatsapp: "5511999990002"
    nivel: avancado
    volume: 1.2
    prova_alvo:
      nome: "Ironman Brasil"
      data: "2027-05-30"
      distancia: "140.6"
    dias_folga: []
    observacoes: "Ex-nadador. Pedal é o ponto fraco. Tende a exagerar na intensidade."
